<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sestao River Cadete Neskak</title>
<link rel="icon" href="escudo.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1c1f24;--mu:#6b7280;--ac:#166534;--bd:#e3e6ea}
@media(prefers-color-scheme:dark){:root{--bg:#121518;--card:#1c2024;--tx:#eef0f2;--mu:#9aa3ad;--ac:#4ade80;--bd:#2c3238}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--ac);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
@media(prefers-color-scheme:dark){header{color:#052e16}}
h1{font-size:20px;margin:0}h2{font-size:15px;margin:0 0 10px}main{max-width:980px;margin:0 auto;padding:14px}
button,select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 11px}
button{cursor:pointer}button.on,button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
header button{background:#fff3;color:inherit;border-color:#fff6}
.bar1{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:14px}nav{display:flex;gap:6px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px;overflow-x:auto}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.grid .card{margin:0}
.kpi b{font-size:26px;display:block}.mu{color:var(--mu);font-size:13px}.y{color:#ca8a04}.r{color:#dc2626}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:7px 5px;text-align:center;border-bottom:1px solid var(--bd)}
th:first-child,td:first-child{text-align:left}th{color:var(--mu);font-size:12px}
td input[type=number]{width:58px;text-align:center;padding:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.row input,.row select{flex:1;min-width:100px}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;margin-right:4px;color:#fff}
.W{background:#16a34a}.D{background:#ca8a04}.L{background:#dc2626}
.pc{display:flex;gap:10px;align-items:center;cursor:pointer}
.pc .num,h2 .num{min-width:52px;height:52px;font-size:18px}.num{min-width:38px;height:38px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:700}
@media(prefers-color-scheme:dark){.num{color:#052e16}}
.mh{display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:8px;flex-wrap:wrap}
.rk{display:grid;grid-template-columns:28px 1fr 2fr 40px;gap:8px;align-items:center;padding:5px 0;font-size:14px}
.bar{height:9px;border-radius:5px;background:var(--ac)}
.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:12px;z-index:9}
.modal>div{background:var(--card);border-radius:14px;max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:16px}
.f1{fill:var(--ac)}.f2{fill:#dc2626}svg text{fill:var(--mu);font-size:10px}
.warn{border-left:4px solid #ca8a04}.K1{background:#2563eb}.K2{background:#7c3aed}.PAID{background:#16a34a}.DEBT{background:#dc2626}details{margin-top:8px}
@media print{nav,header button,.bar1 select,.noprint{display:none!important}}
</style>
</head>
<body>
<header><h1 style="display:flex;align-items:center;gap:10px"><img src="escudo.png" alt="" style="height:46px;background:#fff;border-radius:8px;padding:3px" onerror="this.remove()"><span id="team"></span></h1><div><span id="mode" class="mu" style="color:inherit"></span> <button data-a="auth" id="auth"></button></div></header>
<main><div class="bar1"><nav id="nav"></nav></div><div id="app"></div></main>
<div id="modal"></div>
<script>
// ====== CONFIGURACIÓN (ver README.md) ======
const TEAM = "Sestao River Cadete Neskak";
const SUPABASE_URL = "https://fcqrnxhfrjxoskgfehry.supabase.co";   // Project URL de Supabase
const SUPABASE_KEY = "sb_publishable_pf0aW1jzo2ZKlW5PJABzkw_D12wl0Fq";   // anon public key
const AVISO_AMARILLAS = 4; // jugadoras apercibidas a partir de N amarillas
// ===========================================

const demo = !SUPABASE_URL, sb = demo ? null : supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const POS = {POR:'Porteras', DEF:'Defensas', MED:'Centrocampistas', DEL:'Delanteras'};
const POSA = {...POS, CT:'Cuerpo técnico'};
const RK = {g:'Goles', min:'Minutos', y:'Amarillas', r:'Rojas', pj:'Partidos'};
let S = {players:[], matches:[], stats:[], fines:[], events:[]}, staff = false, tab = 'home', mid = null, rank = 'g', modal = null;
const $ = id => document.getElementById(id), uid = () => Date.now()*1000 + Math.floor(Math.random()*1000);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fd = d => new Date(d+'T00:00').toLocaleDateString('es-ES', {day:'2-digit', month:'short'});
const save = () => localStorage.setItem('demo4', JSON.stringify(S));

function seed() {
  let r = 7; const R = n => ((r = (r*9301+49297) % 233280) / 233280 * n) | 0;
  const P = [['Haizea Liedo','POR',1],['Erika Mora','DEF',20],['Garazi Liedo','DEF',17],['Maialen Martinez','DEF',26],['Laura Saez','DEF',14],['Nancy','DEF',13],['Nahia Diaz','MED',8],['Anne Larraona','MED',18],['June Hernando','MED',7],['Arrate Garcia','DEL',10],['Nerea Santamaria','DEL',19],['Bella','DEL',3],['Naia Giron','DEL',9],['Soiartze Leon','DEL',11],['Nahia Pedrosa','DEL',12]];
  S.players = P.map(([name, position, number], i) => ({id:i+1, name, number, position}));
  const rv = ['Athletic B','Real Sociedad','Alavés','Eibar','Osasuna','Levante'];
  S.matches = rv.map((rival, i) => ({id:i+1, date:`2026-0${i+3}-${10+i*3}`, rival, home:i%2==0, gf:R(4), ga:R(3)}));
  S.stats = [];
  S.matches.forEach(m => {
    const rows = S.players.map((p, i) => {
      const st = i < 11 && R(10) > 0; const min = st ? 55 + R(36) : (R(2) ? 5 + R(30) : 0);
      return {id:uid()+i, match_id:m.id, player_id:p.id, starter:st, minutes:min, goals:0, yellow:R(9)==0?1:0, red:R(40)==0?1:0};
    });
    const pl = rows.filter(x => x.minutes > 0 && S.players[x.player_id-1].position != 'POR');
    for (let g = 0; g < m.gf; g++) { pl[R(pl.length)].goals++; }
    S.stats.push(...rows);
  });
  const d = n => new Date(Date.now() + n*864e5).toISOString().slice(0, 10);
  S.fines = [[2,'Llegar tarde al entrenamiento',5,-12,1],[6,'Protestar al árbitro',10,-8,0],[10,'Olvidar la equipación',5,-3,0],[4,'Llegar tarde a la charla',5,-1,0]].map(([player_id, concept, amount, o, paid], i) => ({id:i+1, player_id, concept, amount, date:d(o), paid:!!paid}));
  S.events = [['entrenamiento','Entrenamiento táctico',1,'19:00','Campo municipal','Traer espinilleras'],['entrenamiento','Entrenamiento físico',3,'19:30','Gimnasio',''],['partido','vs Athletic B',6,'17:00','Campo municipal','Concentración 15:30'],['entrenamiento','Recuperación',8,'18:30','Campo municipal','']].map(([kind, title, o, time, place, notes], i) => ({id:i+1, kind, title, date:d(o), time, place, notes}));
  save();
}
async function load() {
  if (demo) { const l = localStorage.getItem('demo4'); l ? S = JSON.parse(l) : seed(); return; }
  const [p, m, s, f, e] = await Promise.all([sb.from('players').select('*').order('number'), sb.from('matches').select('*').order('date', {ascending:false}), sb.from('stats').select('*'), sb.from('fines').select('*'), sb.from('events').select('*')]);
  S = {players:p.data||[], matches:m.data||[], stats:s.data||[], fines:f.data||[], events:e.data||[]};
}
async function add(t, row) {
  if (demo) { S[t].push({id:uid(), ...row}); return save(); }
  const {error} = await sb.from(t).insert(row); if (error) alert(error.message);
}
async function upd(t, id, patch) {
  if (demo) { Object.assign(S[t].find(x => x.id == id), patch); return save(); }
  const {error} = await sb.from(t).update(patch).eq('id', id); if (error) alert(error.message);
}
async function del(t, id) {
  if (!confirm('¿Eliminar? No se puede deshacer.')) return;
  if (demo) { S[t] = S[t].filter(x => x.id != id); save(); } else { const {error} = await sb.from(t).delete().eq('id', id); if (error) alert(error.message); }
  await refresh();
}
async function setStat(match_id, player_id, f, v) {
  const i = S.stats.findIndex(x => x.match_id == match_id && x.player_id == player_id);
  const row = {...(S.stats[i] || {match_id, player_id, minutes:0, goals:0, yellow:0, red:0, starter:false}), [f]: f == 'starter' ? v : Math.max(0, +v || 0)};
  if (demo) { if (!row.id) row.id = uid(); } else {
    const {data, error} = await sb.from('stats').upsert({...row, id:undefined}, {onConflict:'match_id,player_id'}).select(); if (error) return alert(error.message); Object.assign(row, data[0]);
  }
  i >= 0 ? S.stats[i] = row : S.stats.push(row); if (demo) save();
}
async function refresh() { await load(); render(); }

// ---------- cálculos ----------
const ms = () => [...S.matches].sort((a, b) => b.date.localeCompare(a.date));
function agg(p) {
  const I = new Set(ms().map(m => m.id)), st = S.stats.filter(x => x.player_id == p.id && I.has(x.match_id)), s = f => st.reduce((a, x) => a + (+x[f] || 0), 0);
  return {p, st, pj:st.filter(x => x.minutes > 0).length, gs:st.filter(x => x.starter && x.minutes > 0).length, min:s('minutes'), g:s('goals'), y:s('yellow'), r:s('red')};
}
const res = m => m.gf == null || m.ga == null ? '' : m.gf > m.ga ? 'W' : m.gf < m.ga ? 'L' : 'D';
const RL = {W:'V', D:'E', L:'D'};

// ---------- vistas ----------
function vHome() {
  const M = ms().filter(m => m.gf != null), A = JUG().map(agg), c = {W:0, D:0, L:0}; M.forEach(m => c[res(m)]++);
  const gf = M.reduce((a, m) => a + m.gf, 0), ga = M.reduce((a, m) => a + m.ga, 0);
  const top = (k, ic, lb) => { const x = [...A].sort((a, b) => b[k] - a[k])[0]; return x && x[k] > 0 ? `<div class="card pc" data-a="pl" data-id="${x.p.id}"><div class="num">${ic}</div><div><div class="mu">${lb}</div><b>${esc(x.p.name)}</b> · ${x[k]}</div></div>` : ''; };
  const last = [...M].slice(0, 5).reverse();
  const ch = [...M].slice(0, 8).reverse(), mx = Math.max(1, ...ch.map(m => Math.max(m.gf, m.ga)));
  const svg = ch.length ? `<svg viewBox="0 0 ${ch.length*70} 150" width="100%" style="max-width:${ch.length*80}px">${ch.map((m, i) => `<rect class="f1" x="${i*70+8}" y="${115-m.gf/mx*95}" width="22" height="${m.gf/mx*95}" rx="3"/><rect class="f2" x="${i*70+34}" y="${115-m.ga/mx*95}" width="22" height="${m.ga/mx*95}" rx="3"/><text x="${i*70+8}" y="${112-m.gf/mx*95}">${m.gf}</text><text x="${i*70+34}" y="${112-m.ga/mx*95}">${m.ga}</text><text x="${i*70+8}" y="132">${esc(m.rival.slice(0, 9))}</text><text x="${i*70+8}" y="145">${fd(m.date)}</text>`).join('')}</svg>` : '<span class="mu">Sin resultados todavía.</span>';
  const al = A.filter(x => x.y >= AVISO_AMARILLAS || x.r > 0);
  return `<div class="grid"><div class="card kpi"><span class="mu">Partidos</span><b>${M.length}</b><span class="mu">${c.W}V · ${c.D}E · ${c.L}D</span></div>
  <div class="card kpi"><span class="mu">Goles a favor / contra</span><b>${gf} / ${ga}</b><span class="mu">Dif. ${gf-ga>0?'+':''}${gf-ga}</span></div>
  <div class="card kpi"><span class="mu">Forma (últimos 5)</span><div style="margin-top:10px">${last.map(m => `<span class="chip ${res(m)}">${RL[res(m)]}</span>`).join('') || '–'}</div></div>
  ${top('g','⚽','Máxima goleadora')}${top('min',"'",'Más minutos')}</div>
  <div class="card" style="margin-top:12px"><h2>📅 Próximos eventos</h2>${nextEv()}</div>
  <div class="card"><h2>Goles por partido <span class="mu">(verde a favor · rojo en contra)</span></h2>${svg}</div>
  <div class="card ${al.length ? 'warn' : ''}"><h2>⚠️ Apercibidas y expulsiones</h2>${al.map(x => `<div>${esc(x.p.name)} — <span class="y">🟨 ${x.y}</span> ${x.r ? `<span class="r">🟥 ${x.r}</span>` : ''}</div>`).join('') || '<span class="mu">Nadie por ahora.</span>'}</div>`;
}
const av = p => `<div class="num" style="position:relative;overflow:hidden">${esc(p.number ?? '–')}${p.number != null ? `<img src="fotos/${p.number}.jpg" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover" onerror="this.remove()">` : ''}</div>`;
const pcard = x => `<div class="card pc" data-a="pl" data-id="${x.p.id}">${av(x.p)}<div><b>${esc(x.p.name)}</b><div class="mu">${x.pj} PJ (${x.gs} tit.) · ${x.min}'</div><div>⚽${x.g} <span class="y">🟨${x.y}</span> <span class="r">🟥${x.r}</span></div></div></div>`;
function vSquad() {
  const A = JUG().map(agg);
  return Object.keys(POS).map(k => { const l = A.filter(x => x.p.position == k); return l.length ? `<h2>${POS[k]}</h2><div class="grid" style="margin-bottom:16px">${l.map(pcard).join('')}</div>` : ''; }).join('') || '<div class="card mu">Sin jugadoras.</div>';
}
function vMatches() {
  const M = ms(), f = staff ? `<div class="card noprint"><h2>Nuevo partido</h2><div class="row"><input type="date" id="md"><input id="mr" placeholder="Rival"><select id="mh"><option value="1">Local</option><option value="0">Visitante</option></select><input id="mgf" type="number" min="0" placeholder="Goles a favor"><input id="mga" type="number" min="0" placeholder="Goles en contra"><button class="pri" data-a="addm">Añadir</button></div></div>` : '';
  return f + (M.map(m => {
    const open = m.id == mid, r = res(m);
    const body = open ? `<div style="margin-top:10px">${staff ? `<div class="row noprint"><input type="date" data-e="matches:${m.id}:date" value="${m.date}"><input data-e="matches:${m.id}:rival" value="${esc(m.rival)}"><select data-e="matches:${m.id}:home"><option value="1" ${m.home ? 'selected' : ''}>Local</option><option value="0" ${m.home ? '' : 'selected'}>Visitante</option></select><input type="number" min="0" placeholder="Goles a favor" data-e="matches:${m.id}:gf" value="${m.gf ?? ''}"><input type="number" min="0" placeholder="Goles en contra" data-e="matches:${m.id}:ga" value="${m.ga ?? ''}"><button data-a="delm" data-id="${m.id}">Eliminar partido</button></div>` : ''}
    <table><tr><th>Jugadora</th><th>Tit.</th><th>Min</th><th>⚽</th><th>🟨</th><th>🟥</th></tr>${JUG().map(p => {
      const s = S.stats.find(x => x.match_id == m.id && x.player_id == p.id) || {};
      const c = f => staff ? `<input type="number" min="0" data-p="${p.id}" data-f="${f}" value="${s[f] || 0}">` : (s[f] || 0);
      return `<tr><td>${p.number ?? ''} ${esc(p.name)}</td><td>${staff ? `<input type="checkbox" data-p="${p.id}" data-f="starter" ${s.starter ? 'checked' : ''}>` : (s.starter ? '✔' : '')}</td><td>${c('minutes')}</td><td>${c('goals')}</td><td>${c('yellow')}</td><td>${c('red')}</td></tr>`;
    }).join('')}</table></div>` : '';
    return `<div class="card"><div class="mh" data-a="mt" data-id="${m.id}"><div><b>vs ${esc(m.rival)}</b> <span class="mu">${fd(m.date)}</span></div><div>${r ? `<span class="chip ${r}">${RL[r]}</span> <b>${m.gf} - ${m.ga}</b>` : '<span class="mu">Sin resultado</span>'}</div></div>${body}</div>`;
  }).join('') || '<div class="card mu">Aún no hay partidos.</div>');
}
function vRank() {
  const A = JUG().map(agg).sort((a, b) => b[rank] - a[rank]), mx = Math.max(1, A[0]?.[rank] || 1);
  return `<div class="row">${Object.entries(RK).map(([k, l]) => `<button class="${rank == k ? 'on' : ''}" data-a="rank" data-v="${k}">${l}</button>`).join('')}</div>
  <div class="card">${A.map((x, i) => `<div class="rk" data-a="pl" data-id="${x.p.id}" style="cursor:pointer"><span class="mu">${i+1}</span><span>${esc(x.p.name)}</span><div><div class="bar" style="width:${x[rank]/mx*100}%"></div></div><b>${x[rank]}</b></div>`).join('')}</div>`;
}
function vAdmin() {
  return `<div class="card"><h2>Añadir jugadora o miembro del cuerpo técnico</h2><div class="row"><input id="pn" placeholder="Nombre"><input id="pd" type="number" placeholder="Dorsal (vacío si es cuerpo técnico)"><select id="pp">${Object.entries(POSA).map(([k, l]) => `<option value="${k}">${l}</option>`).join('')}</select><button class="pri" data-a="addp">Añadir</button></div>
  <table>${S.players.map(p => `<tr><td><input type="number" style="width:64px" data-e="players:${p.id}:number" value="${p.number ?? ''}"></td><td><input data-e="players:${p.id}:name" value="${esc(p.name)}"></td><td><select data-e="players:${p.id}:position">${Object.entries(POSA).map(([k, l]) => `<option value="${k}" ${p.position == k ? 'selected' : ''}>${l}</option>`).join('')}</select></td><td><button data-a="delp" data-id="${p.id}">Eliminar</button></td></tr>`).join('')}</table></div>
  <div class="card"><h2>Herramientas</h2><div class="row"><button data-a="csv">Descargar CSV de estadísticas</button><button data-a="print">Imprimir / PDF</button>${demo ? '<button data-a="reset">Restablecer demo</button>' : ''}</div></div>`;
}
function vModal() {
  const x = modal && JUG().map(agg).find(a => a.p.id == modal); if (!x) return '';
  const rows = ms().map(m => ({m, s:x.st.find(s => s.match_id == m.id)})).filter(r => r.s).reverse();
  const bars = `<svg viewBox="0 0 ${Math.max(rows.length, 1)*44} 90" width="100%" style="max-width:${rows.length*54}px">${rows.map((r, i) => `<rect class="f1" x="${i*44+6}" y="${65-r.s.minutes/95*55}" width="28" height="${r.s.minutes/95*55}" rx="3"/><text x="${i*44+8}" y="${62-r.s.minutes/95*55}">${r.s.minutes}'</text><text x="${i*44+6}" y="80">${esc(r.m.rival.slice(0, 5))}</text>`).join('')}</svg>`;
  return `<div class="modal" data-a="close"><div><div class="row" style="justify-content:space-between"><h2 style="font-size:18px;display:flex;align-items:center;gap:10px">${av(x.p)} ${esc(x.p.name)} <span class="mu">${POS[x.p.position] || ''}</span></h2><button data-a="close">✕</button></div>
  <div class="grid" style="margin-bottom:12px">${[['Partidos',x.pj],['Titular',x.gs],['Minutos',x.min],['Goles',x.g],['🟨',x.y],['🟥',x.r],["Min/partido",x.pj ? Math.round(x.min/x.pj) : 0]].map(([l, v]) => `<div class="card kpi"><span class="mu">${l}</span><b>${v}</b></div>`).join('')}</div>
  <h2>Minutos por partido</h2>${bars}<table style="margin-top:10px"><tr><th>Partido</th><th>Min</th><th>⚽</th><th>🟨</th><th>🟥</th></tr>${rows.map(r => `<tr><td>${fd(r.m.date)} ${esc(r.m.rival)}</td><td>${r.s.minutes}</td><td>${r.s.goals}</td><td>${r.s.yellow}</td><td>${r.s.red}</td></tr>`).join('')}</table></div></div>`;
}
const isP = p => p.position != 'CT', JUG = () => S.players.filter(isP);
const ptOpts = sel => ['Jugadoras', 'Cuerpo técnico'].map((l, k) => { const L = S.players.filter(p => isP(p) == !k); return L.length ? `<optgroup label="${l}">${L.map(p => `<option value="${p.id}" ${p.id == sel ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</optgroup>` : ''; }).join('');
const today = () => new Date(Date.now() - new Date().getTimezoneOffset()*6e4).toISOString().slice(0, 10);
const eur = n => (+n || 0).toLocaleString('es-ES', {style:'currency', currency:'EUR'});
const KD = {entrenamiento:['Entrenamiento','K1'], partido:['Partido','K2']};
const upEv = () => S.events.filter(e => e.date >= today()).sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || '')));
const nextEv = () => upEv().slice(0, 3).map(e => `<div style="padding:4px 0"><span class="chip ${KD[e.kind][1]}">${KD[e.kind][0]}</span> ${esc(e.title)} <span class="mu">· ${fd(e.date)} ${esc((e.time || '').slice(0, 5))}</span></div>`).join('') || '<span class="mu">Sin eventos programados.</span>';
const evView = e => `<div class="card" style="display:flex;gap:10px;justify-content:space-between;align-items:flex-start"><div><span class="chip ${KD[e.kind][1]}">${KD[e.kind][0]}</span> <b>${esc(e.title)}</b><div class="mu" style="text-transform:capitalize">${new Date(e.date+'T00:00').toLocaleDateString('es-ES', {weekday:'long', day:'numeric', month:'long'})}${e.time ? ' · ' + esc(e.time.slice(0, 5)) : ''}</div><div class="mu">${e.place ? '📍 ' + esc(e.place) : ''}${e.notes ? ' — ' + esc(e.notes) : ''}</div></div>${staff ? `<button data-a="delx" data-t="events" data-id="${e.id}">Eliminar</button>` : ''}</div>`;
const evRow = e => !staff ? evView(e) : `<div class="card"><div class="row" style="margin:0"><select data-e="events:${e.id}:kind"><option value="entrenamiento" ${e.kind == 'entrenamiento' ? 'selected' : ''}>Entrenamiento</option><option value="partido" ${e.kind == 'partido' ? 'selected' : ''}>Partido</option></select><input data-e="events:${e.id}:title" value="${esc(e.title)}"><input type="date" data-e="events:${e.id}:date" value="${e.date}"><input type="time" data-e="events:${e.id}:time" value="${esc((e.time || '').slice(0, 5))}"><input placeholder="Lugar" data-e="events:${e.id}:place" value="${esc(e.place)}"><input placeholder="Notas" data-e="events:${e.id}:notes" value="${esc(e.notes)}"><button data-a="delx" data-t="events" data-id="${e.id}">Eliminar</button></div></div>`;
function vSched() {
  const f = staff ? `<div class="card noprint"><h2>Nuevo evento</h2><div class="row"><select id="ek"><option value="entrenamiento">Entrenamiento</option><option value="partido">Partido</option></select><input id="et" placeholder="Título"><input type="date" id="ed" value="${today()}"><input type="time" id="eh"><input id="ep" placeholder="Lugar"><input id="en" placeholder="Notas"><button class="pri" data-a="adde">Añadir</button></div></div>` : '';
  const past = S.events.filter(e => e.date < today()).sort((a, b) => b.date.localeCompare(a.date));
  return f + (upEv().map(evRow).join('') || '<div class="card mu">Sin eventos programados.</div>') + (past.length ? `<details><summary class="mu" style="cursor:pointer">Eventos pasados (${past.length})</summary>${past.map(evRow).join('')}</details>` : '');
}
const fRow = x => !staff ? `<tr><td>${esc(S.players.find(p => p.id == x.player_id)?.name || '—')}</td><td>${esc(x.concept)}</td><td>${fd(x.date)}</td><td>${eur(x.amount)}</td><td><span class="chip ${x.paid ? 'PAID' : 'DEBT'}">${x.paid ? 'Pagada' : 'Pendiente'}</span></td></tr>`
  : `<tr><td><select data-e="fines:${x.id}:player_id">${ptOpts(x.player_id)}</select></td><td><input data-e="fines:${x.id}:concept" value="${esc(x.concept)}"></td><td><input type="date" data-e="fines:${x.id}:date" value="${x.date}"></td><td><input type="number" min="0" step="0.5" style="width:80px" data-e="fines:${x.id}:amount" value="${x.amount}"></td><td><label><input type="checkbox" data-e="fines:${x.id}:paid" ${x.paid ? 'checked' : ''}> Pagada</label> <button data-a="delx" data-t="fines" data-id="${x.id}">✕</button></td></tr>`;
function vFines() {
  const F = [...S.fines].sort((a, b) => b.date.localeCompare(a.date)), nm = id => esc(S.players.find(p => p.id == id)?.name || '—'), sum = l => l.reduce((a, f) => a + (+f.amount || 0), 0);
  const debt = S.players.map(p => ({p, d:sum(F.filter(f => f.player_id == p.id && !f.paid))})).filter(x => x.d > 0).sort((a, b) => b.d - a.d);
  const f = staff ? `<div class="card noprint"><h2>Nueva multa</h2><div class="row"><select id="fp">${ptOpts()}</select><input id="fc" placeholder="Concepto"><input id="fa" type="number" min="0" step="0.5" placeholder="Importe €"><input id="fdt" type="date" value="${today()}"><button class="pri" data-a="addf">Añadir</button></div></div>` : '';
  return f + `<div class="grid" style="margin-bottom:12px"><div class="card kpi"><span class="mu">Pendiente de cobro</span><b class="r">${eur(sum(F.filter(x => !x.paid)))}</b></div><div class="card kpi"><span class="mu">Cobrado</span><b>${eur(sum(F.filter(x => x.paid)))}</b></div></div>`
    + (debt.length ? `<div class="card"><h2>Pendiente por persona</h2>${debt.map(x => `<div class="rk" style="grid-template-columns:1fr auto"><span>${esc(x.p.name)}</span><b class="r">${eur(x.d)}</b></div>`).join('')}</div>` : '')
    + (F.length ? `<div class="card"><h2>Historial</h2><table><tr><th>Jugadora</th><th>Concepto</th><th>Fecha</th><th>Importe</th><th>Estado</th></tr>${F.map(fRow).join('')}</table></div>` : '<div class="card mu">No hay multas registradas.</div>');
}
function render() {
  $('team').textContent = TEAM; document.title = TEAM + ' · Estadísticas';
  $('mode').textContent = demo ? 'Modo demo' : (staff ? 'Cuerpo técnico' : ''); $('auth').textContent = staff ? 'Salir' : 'Acceso cuerpo técnico';
  const T = [['home','Inicio'], ['squad','Plantilla'], ['matches','Partidos'], ['sched','Horarios'], ['fines','Multas'], ['rank','Rankings']].concat(staff ? [['admin','Gestión']] : []);
  if (!staff && tab == 'admin') tab = 'home';
  $('nav').innerHTML = T.map(([k, l]) => `<button class="${tab == k ? 'on' : ''}" data-a="tab" data-v="${k}">${l}</button>`).join('');
  $('app').innerHTML = {home:vHome, squad:vSquad, matches:vMatches, sched:vSched, fines:vFines, rank:vRank, admin:vAdmin}[tab]();
  $('modal').innerHTML = vModal();
}
function csv() {
  const L = [['Jugadora','Dorsal','Posicion','PJ','Titular','Minutos','Goles','Amarillas','Rojas']].concat(JUG().map(agg).map(x => [x.p.name, x.p.number, x.p.position, x.pj, x.gs, x.min, x.g, x.y, x.r]));
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff' + L.map(r => r.map(c => `"${c ?? ''}"`).join(';')).join('\n')], {type:'text/csv'})); a.download = 'estadisticas.csv'; a.click();
}

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-a]'); if (!t) return; const a = t.dataset.a, id = Number(t.dataset.id), v = t.dataset.v, g = i => $(i).value.trim();
  if (a == 'close') { if (e.target == t || t.tagName == 'BUTTON') { modal = null; render(); } return; }
  if (a == 'tab') { tab = v; render(); }
  else if (a == 'rank') { rank = v; render(); }
  else if (a == 'pl') { modal = id; render(); }
  else if (a == 'mt') { mid = mid == id ? null : id; render(); }
  else if (a == 'delm') { mid = null; del('matches', id); }
  else if (a == 'delp') del('players', id);
  else if (a == 'delx') del(t.dataset.t, id);
  else if (a == 'addf') { if (!g('fc') || !g('fa')) return alert('Indica concepto e importe'); await add('fines', {player_id:+g('fp'), concept:g('fc'), amount:+g('fa'), date:g('fdt'), paid:false}); refresh(); }
  else if (a == 'adde') { if (!g('et') || !g('ed')) return alert('Indica título y fecha'); await add('events', {kind:g('ek'), title:g('et'), date:g('ed'), time:g('eh') || null, place:g('ep'), notes:g('en')}); refresh(); }
  else if (a == 'csv') csv(); else if (a == 'print') print();
  else if (a == 'reset') { if (confirm('¿Borrar datos y volver a la demo?')) { localStorage.removeItem('demo4'); refresh(); } }
  else if (a == 'addm') { if (!g('md') || !g('mr')) return alert('Indica fecha y rival'); await add('matches', {date:g('md'), rival:g('mr'), home:g('mh') == '1', gf:g('mgf') === '' ? null : +g('mgf'), ga:g('mga') === '' ? null : +g('mga')}); refresh(); }
  else if (a == 'addp') { if (!g('pn')) return alert('Escribe un nombre'); await add('players', {name:g('pn'), number:g('pd') ? +g('pd') : null, position:g('pp')}); refresh(); }
  else if (a == 'auth') {
    if (staff) { if (!demo) await sb.auth.signOut(); staff = false; return render(); }
    if (demo) { staff = true; return render(); }
    const email = prompt('Email del cuerpo técnico:'), password = email && prompt('Contraseña:'); if (!password) return;
    const {error} = await sb.auth.signInWithPassword({email, password}); if (error) return alert('Acceso incorrecto'); staff = true; render();
  }
});
document.addEventListener('change', async e => {
  const i = e.target;
  if (i.dataset.f) setStat(mid, Number(i.dataset.p), i.dataset.f, i.type == 'checkbox' ? i.checked : i.value);
  else if (i.dataset.e) {
    const [t, id, f] = i.dataset.e.split(':'); let v = i.type == 'checkbox' ? i.checked : i.type == 'number' ? (i.value === '' ? null : +i.value) : i.value;
    if (f == 'home') v = v == '1'; if (f == 'player_id') v = +v;
    if (v === '' && ['title','rival','name','concept','date'].includes(f)) return render();
    if (v === '') v = null;
    await upd(t, +id, {[f]: v}); Object.assign(S[t].find(x => x.id == id), {[f]: v});
    if (i.tagName == 'SELECT' || ['checkbox','number','date'].includes(i.type)) render();
  }
});
(async () => { if (!demo) { const {data} = await sb.auth.getSession(); staff = !!data.session; } await refresh(); })();
</script>
</body>
